# ISA Workspace Configuration
# Copy this file to config.toml and customize as needed

[server]
host = "0.0.0.0"
port = 3000
workers = 4

[firecracker]
binary_path = "/usr/bin/firecracker"
jailer_path = "/usr/bin/jailer"
workspace_root = "/tmp/isa-workspace"
use_jailer = false
network_iface = "eth0"

[state_store]
backend = "local"
storage_path = "/tmp/isa-state-store"
cache_size_mb = 1024
default_ttl_hours = 24
enable_gc = true
gc_interval_secs = 3600

[quic]
port = 4433
use_tls = false
timeout_secs = 30

[logging]
level = "info"
format = "full"
