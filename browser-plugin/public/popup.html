<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISA Workspace</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.8;
    }

    .content {
      padding: 20px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #eee;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .states-list {
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
    }

    .state-item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .state-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .state-item h3 {
      font-size: 14px;
      margin-bottom: 5px;
    }

    .state-item p {
      font-size: 11px;
      opacity: 0.6;
    }

    .loading {
      text-align: center;
      padding: 40px;
      opacity: 0.6;
    }

    .error {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #ff6b6b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .success {
      background: rgba(0, 255, 0, 0.1);
      border: 1px solid rgba(0, 255, 0, 0.3);
      color: #6bff6b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.6;
    }

    .empty-state p {
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚀 ISA Workspace</h1>
    <p>Instant State Applications</p>
  </div>

  <div class="content">
    <div id="message"></div>

    <button id="captureBtn" class="btn btn-primary">
      📸 Capture Current State
    </button>

    <button id="refreshBtn" class="btn btn-secondary">
      🔄 Refresh States
    </button>

    <div id="statesList" class="states-list">
      <div class="loading">Loading states...</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
